<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма заявок</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; line-height: 1.5; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        select, input { width: 100%; padding: 8px; box-sizing: border-box; }
        .hidden { display: none; }
        .report { margin-top: 24px; padding: 16px; background: #f0f0f0; border-radius: 4px; white-space: pre-wrap; border: 1px solid #ccc; }
        button { padding: 10px 16px; cursor: pointer; margin-right: 8px; }
    </style>
</head>
<body>
    <h1>Заявка</h1>
    <form id="mainForm">
        <div class="form-group">
            <label>Номер бригады</label>
            <select id="brigade">
                <option value="">— выберите —</option>
                <option value="Б-01">Бригада №1</option>
                <option value="Б-02">Бригада №2</option>
                <option value="Б-03">Бригада №3</option>
                <option value="Б-04">Бригада №4</option>
                <option value="Б-05">Бригада №5</option>
                <option value="Б-06">Бригада №6</option>
                <option value="Б-07">Бригада №7</option>
                <option value="Б-08">Бригада №8</option>
                <option value="Б-09">Бригада №9</option>
                <option value="Б-10">Бригада №10</option>
                <option value="Б-11">Бригада №11</option>
                <option value="Б-12">Бригада №12</option>
                <option value="Б-13">Бригада №13</option>
                <option value="Б-14">Бригада №14</option>
                <option value="Б-15">Бригада №15</option>
                <option value="Б-16">Бригада №16</option>
            </select>
        </div>

        <div class="form-group">
            <label>Куст / скважина</label>
            <input type="text" id="well" placeholder="Например: куст 45, скважина 12-Б">
        </div>

        <div class="form-group">
            <label>Дата</label>
            <input type="date" id="date">
        </div>

        <div class="form-group">
            <label>Вид заявки</label>
            <select id="type">
                <option value="">— выберите —</option>
                <option value="сводка">Сводка</option>
                <option value="СПТ">СПТ</option>
                <option value="оборудование">Оборудование</option>
            </select>
        </div>

        <!-- Только для СПТ -->
        <div id="blockTech" class="hidden form-group">
            <label>Техника</label>
            <select id="tech">
                <option value="">— выберите —</option>
                <option value="ЦА">ЦА</option>
                <option value="АЦ">АЦ</option>
                <option value="АКН">АКН</option>
                <option value="А/К">А/К</option>
            </select>
        </div>

        <!-- Всегда виден -->
        <div class="form-group">
            <label>Временной интервал</label>
            <select id="time">
                <option value="">— выберите —</option>
                <option value="06:00-10:00">06:00–10:00</option>
                <option value="10:00-14:00">10:00–14:00</option>
                <option value="14:00-18:00">14:00–18:00</option>
                <option value="18:00-22:00">18:00–22:00</option>
                <option value="22:00-02:00">22:00–02:00</option>
                <option value="02:00-06:00">02:00–06:00</option>
            </select>
        </div>

        <div style="margin-top: 20px;">
            <button type="button" id="makeReport">Сформировать отчёт</button>
            <button type="button" id="reset">Сбросить</button>
        </div>

        <div class="report" id="report">
            <p>Заполните форму и нажмите «Сформировать отчёт».</p>
        </div>
    </form>

    <script>
        const dateInput = document.getElementById('date');
        dateInput.value = new Date().toISOString().split('T')[0];

        function show(id) { document.getElementById(id).classList.remove('hidden'); }
        function hide(id) { document.getElementById(id).classList.add('hidden'); }

        document.getElementById('type').addEventListener('change', function(e) {
            if (e.target.value === 'СПТ') show('blockTech');
            else {
                hide('blockTech');
                document.getElementById('tech').value = '';
            }
        });

        document.getElementById('makeReport').addEventListener('click', function() {
            const brigade = document.getElementById('brigade').value || 'не выбрано';
            const well = document.getElementById('well').value.trim() || 'не указано';
            const date = document.getElementById('date').value || '';
            const type = document.getElementById('type').value || 'не выбрано';
            const tech = document.getElementById('tech').value || '';
            const time = document.getElementById('time').value || 'не выбрано';

            if (!brigade || !type) {
                alert('Заполните обязательные поля: бригада и вид заявки.');
                return;
            }

            let text = `========================================\nЗАЯВКА\n========================================\nБригада: ${brigade}\nКуст / скважина: ${well}\nДата: ${date}\nВид заявки: ${type}\n`;

            if (tech) text += `Техника: ${tech}\n`;
            text += `Интервал: ${time}\n`;

            text += `\n========================================`;

            document.getElementById('report').innerHTML = text;
        });

        document.getElementById('reset').addEventListener('click', function() {
            document.getElementById('mainForm').reset();
            dateInput.value = new Date().toISOString().split('T')[0];
            hide('blockTech');
            document.getElementById('tech').value = '';
            document.getElementById('time').value = '';
            document.getElementById('report').innerHTML = '<p>Форма сброшена.</p>';
        });
    </script>
</body>
</html>
